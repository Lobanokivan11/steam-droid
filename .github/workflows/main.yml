name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties
        run: powershell -ExecutionPolicy Bypass -File .\tools\write-local-properties.ps1

      - name: Fetch and stage Valve's Android libraries
        run: powershell -ExecutionPolicy Bypass -File .\tools\fetch-valve-android-libs.ps1

      - name: Build with Gradle
        run: .\gradlew.bat assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
